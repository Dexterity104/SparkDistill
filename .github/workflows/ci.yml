name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: this job runs untrusted PR code (the test suite), so it gets a
# read-only token and no secrets. Never use pull_request_target here — the code /
# quality gate must not expose credentials to fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        # --extra proof so pyright can resolve proof/ imports (pyjwt, dcap-qvl,
        # nv-attestation-sdk). SparkProof itself is not installed here, so the tests
        # that need it skip by design (see tests/conftest.py) — no secret exposure.
        run: uv sync --extra dev --extra proof --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q
