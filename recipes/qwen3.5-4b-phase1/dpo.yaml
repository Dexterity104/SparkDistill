# Axolotl DPO — Phase 1 student: Qwen3.5-4B (canonical preference dataset only).
#
# Preference-tuning track. Trains on SparkProof-attested preference pairs
# (chosen = a hardware-verified kernel, rejected = a validated-failing one), so the
# preference signal is grounded in GPU validation, not human labels.
#
#   scripts/prepare_mining_dpo.sh
#   scripts/train.sh recipes/qwen3.5-4b-phase1/dpo.yaml
#
# The training-track gate accepts this recipe because `rl: dpo` selects the canonical
# *preference* dataset path; an SFT recipe pointing here (or this recipe pointing at the
# SFT mix) is rejected. Scoring is unchanged — the same held-out benchmark delta over the
# frontier decides the reward, independent of training method.

base_model: Qwen/Qwen3.5-4B
trust_remote_code: true

chat_template: qwen3_5

# Direct Preference Optimization on chosen/rejected pairs.
rl: dpo
rl_beta: 0.1

datasets:
  - path: data/processed/sparkproof-mining_dpo.jsonl
    type: chat_template.argilla

dataset_prepared_path: data/prepared/qwen3.5-4b-phase1-dpo
output_dir: outputs/qwen3.5-4b-phase1-dpo

sequence_len: 4096

# BF16 LoRA fits comfortably on RTX PRO 6000 Blackwell (96 GB) for 4B dense.
adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 5.0e-6
warmup_ratio: 0.1
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

saves_per_epoch: 2
